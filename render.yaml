services:
  - type: web
    name: kto-approval-guide
    runtime: python
    plan: starter
    buildCommand: python3 -m py_compile server.py
    startCommand: python3 server.py --host 0.0.0.0 --port $PORT --data-dir /var/data/approval
    healthCheckPath: /api/cases
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: APP_SECURE_COOKIES
        value: "1"
      - key: APP_ADMIN_PASSWORD
        sync: false
    disk:
      name: approval-data
      mountPath: /var/data
      sizeGB: 1
